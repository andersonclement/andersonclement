{% extends "base.html" %}
{% block title %}Connexion - SmartTrader 7CAS{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <h1>SmartTrader 7CAS</h1>
      <p>Trading automatique intelligent</p>
    </div>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="username">Identifiant</label>
        <input type="text" id="username" name="username" required autofocus
               placeholder="Ex: ID001"
               style="text-transform:uppercase; letter-spacing:0.1em; text-align:center; font-size:1.1rem">
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>

    <div class="auth-footer">
      Premiere connexion ?
      <a href="{{ url_for('activation') }}">Activer avec un code</a>
    </div>
  </div>
</div>
{% endblock %}
